[workspace]
authors = ["baka-gourd <36119339+baka-gourd@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "FontLoaderSub"
platforms = ["win-64"]
version = "2.0.0"
preview = ["pixi-build"]

[pypi-options]
index-url = "https://pypi.org/simple"

[tasks]
build = { cmd = "meson compile -C build-meson", depends-on = ["setup"] }

[tasks.setup]
cmd = "meson setup build-meson --wipe -Dvcpkg_root=\"$PIXI_PROJECT_ROOT/vcpkg\" -Dvcpkg_triplet=x64-windows-static -Dbuildtype=release -Db_lto=true --vsenv"

[dependencies]
python = "3.12.*"

[pypi-dependencies]
ninja = ">=1.13.2, <2"
meson = ">=1.12.1, <2"
